name: Construire le .exe Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version à publier (ex. v1.0.0)"
        default: "v2.5.0"
        required: true

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les bibliothèques
        run: |
          python -m pip install --upgrade pip
          pip install numpy sounddevice pyserial certifi pyinstaller

      - name: Tests rapides (messages, séquenceur, modulation)
        run: |
          python -c "import message, modem, decodeur, sequenceur, journal_adif, radio, radiodlg, liaison, reglages, theme_vhf, updater, f4gop_vhf; print('imports OK')"
          python tests/test_sequenceur.py
          python -c "from modem import moduler, demoduler; a = moduler('CQ F4GOP IN98QR', 'R15', 1500); print(demoduler(a, 'R15', 1500))"

      - name: Construire F4GOP-VHF.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name F4GOP-VHF
          --exclude-module scipy --exclude-module matplotlib
          --hidden-import radiodlg --hidden-import reglages --hidden-import updater
          f4gop_vhf.py

      - name: Garder le .exe (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: F4GOP-VHF-exe
          path: dist/F4GOP-VHF.exe

      - name: Publier dans les Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: F4GOP VHF ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/F4GOP-VHF.exe
          body: |
            F4GOP VHF — mode numérique cohérent pour la VHF/UHF (Icom IC-9700).
            Télécharger F4GOP-VHF.exe ci-dessous et double-cliquer : rien à installer.
            Réglages du poste (IC-9700 et tous les postes VHF/UHF) et mode d'emploi : voir le README du dépôt.
